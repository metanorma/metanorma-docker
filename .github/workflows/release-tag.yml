name: release-tag

on:
  repository_dispatch:
    types: [ metanorma/metanorma-cli ]
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next version. Should correspond to the released metanorma-cli gem
          AND the published tebako payload (tebako-packages/metanorma) of
          the same version — the tag build fails closed if the payload is
          not published yet.
        required: true

jobs:
  push-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.ref != 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - run: |
        git config --global user.name "metanorma-ci"
        git config --global user.email "metanorma-ci@users.noreply.github.com"

    - if: github.event_name == 'repository_dispatch'
      name: Parse metanorma-cli version (repository_dispatch)
      env:
        METANORMA_CLI_TAG: ${{ github.event.client_payload.ref }}
      run: |
        echo METANORMA_CLI_VERSION=${METANORMA_CLI_TAG#*/v} >> ${GITHUB_ENV}

    - if: github.event_name == 'workflow_dispatch'
      name: Parse metanorma-cli version (workflow_dispatch)
      run: |
        echo METANORMA_CLI_VERSION=${{ github.event.inputs.next_version }} >> ${GITHUB_ENV}

    - name: Docker tag version
      run: |
        curl -LO --retry 3 https://raw.githubusercontent.com/metanorma/metanorma-build-scripts/main/gemver-to-semver.rb && chmod +x gemver-to-semver.rb
        echo "DOCKER_TAG=$(./gemver-to-semver.rb --strip-prefix ${METANORMA_CLI_VERSION})" >> $GITHUB_ENV

    - uses: rubenesp87/semver-validation-action@0.1.0
      with:
        version: ${{ env.DOCKER_TAG }}

    - name: Update versions and payload digests (VERSION.mak is the SSOT)
      env:
        REGISTRY_URL: https://raw.githubusercontent.com/tebako-packages/metanorma/main/tpkg-registry.yaml
      run: |
        ruby -ryaml -ropen-uri -e '
          version = ENV.fetch("METANORMA_CLI_VERSION")
          registry = YAML.safe_load(URI.open(ENV.fetch("REGISTRY_URL")).read)
          metanorma = registry["payloads"].find { |p| p["name"] == "metanorma" }
          entry = metanorma["versions"].find { |v| v["version"] == version }
          unless entry
            available = metanorma["versions"].map { |v| v["version"] }.join(", ")
            abort "payload metanorma@#{version} is not published in #{ENV["REGISTRY_URL"]} " \
                  "(available: #{available}) — publish the tebako payload release first"
          end
          digests = entry["platforms"]
          lines = File.read("VERSION.mak")
          lines.gsub!(/^IMAGE_VERSION := .*$/, "IMAGE_VERSION := #{version}")
          lines.gsub!(/^METANORMA_VERSION := .*$/, "METANORMA_VERSION := #{version}")
          {
            "GNU_X86_64" => "x86_64-linux-gnu", "GNU_ARM64" => "aarch64-linux-gnu",
            "MUSL_X86_64" => "x86_64-linux-musl", "MUSL_ARM64" => "aarch64-linux-musl"
          }.each do |suffix, triplet|
            sha = digests.fetch(triplet) { abort "registry entry has no #{triplet} digest" }["sha256"]
            lines.gsub!(/^METANORMA_SHA256_#{suffix} := .*$/, "METANORMA_SHA256_#{suffix} := #{sha}")
          end
          File.write("VERSION.mak", lines)
        '
        # Legacy alpine variant: keep its gem pin in lockstep.
        sed -i.bak "s/gem \"metanorma-cli\", \"= .*\"/gem \"metanorma-cli\", \"= ${METANORMA_CLI_VERSION}\"/" metanorma-alpine/Gemfile
        rm -f metanorma-alpine/Gemfile.bak

    - name: Push commit and tag
      run: |
        git add VERSION.mak metanorma-alpine/Gemfile
        git commit -m "Bump version to ${DOCKER_TAG}"
        git tag v${DOCKER_TAG}
        git push origin HEAD:${GITHUB_REF} --tags
