name: Container Vulnerability Scan with Trivy

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.*'
      - '.trivyignore'
      - '.github/workflows/trivy.yml'
  pull_request:
    paths:
      - 'Dockerfile.*'
      - '.trivyignore'
      - '.github/workflows/trivy.yml'
  workflow_dispatch:
    inputs:
      test_vulnerable_base:
        description: 'Verify the Trivy gate fails on a deliberately vulnerable base image (alpine:3.20.0)'
        type: boolean
        required: false
        default: false

env:
  TRIVY_SEVERITY: 'CRITICAL,HIGH'

permissions:
 contents: read
 security-events: write

jobs:
  trivy-scan:
    name: Trivy image scan (${{ matrix.image_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_type: [alpine, debian]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read base image version
        if: github.event.inputs.test_vulnerable_base != 'true'
        run: |
          echo "RUBY_VERSION=$(grep '^RUBY_VERSION :=' VERSION.mak | cut -d ' ' -f 3)" >> $GITHUB_ENV
          echo "ALPINE_RUBY_VERSION=$(grep '^ALPINE_RUBY_VERSION :=' VERSION.mak | cut -d ' ' -f 3)" >> $GITHUB_ENV

      - name: Build Docker Image
        if: github.event.inputs.test_vulnerable_base != 'true'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image_type }}
          tags: metanorma-${{ matrix.image_type }}:test
          load: true
          push: false
          build-args: |
            METANORMA_IMAGE_NAME=metanorma-${{ matrix.image_type }}
            RUBY_VERSION=${{ env.RUBY_VERSION }}
            ALPINE_RUBY_VERSION=${{ env.ALPINE_RUBY_VERSION }}

      # The gate: table format, exit 1 on any fixable finding at or above
      # TRIVY_SEVERITY not in .trivyignore. Table is used for the gate
      # deliberately — the sarif invocation of trivy-action exits 1 even when
      # the same scan scores zero findings, and a red table gate prints its
      # findings inline.
      - name: Trivy gate (table, blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.event.inputs.test_vulnerable_base == 'true' && 'alpine:3.20.0' || format('metanorma-{0}:test', matrix.image_type) }}
          format: 'table'
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

      # Advisory: SARIF report for GitHub Code Scanning. Never blocks.
      - name: Trivy (SARIF for Code Scanning)
        if: github.event.inputs.test_vulnerable_base != 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: metanorma-${{ matrix.image_type }}:test
          format: 'sarif'
          output: 'trivy-${{ matrix.image_type }}.sarif'
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event.inputs.test_vulnerable_base != 'true'
        with:
          sarif_file: trivy-${{ matrix.image_type }}.sarif
          category: trivy-${{ matrix.image_type }}
