name: Container Vulnerability Scan with Trivy

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.*'
      - '.github/workflows/trivy.yml'
  pull_request:
    paths:
      - 'Dockerfile.*'
      - '.github/workflows/trivy.yml'
  workflow_dispatch:

permissions:
 contents: read
 security-events: write

jobs:
  trivy-scan:
    name: Trivy image scan (${{ matrix.image_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_type: [alpine, debian]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read base image version
        run: |
          echo "RUBY_VERSION=$(grep '^RUBY_VERSION :=' VERSION.mak | cut -d ' ' -f 3)" >> $GITHUB_ENV

      - name: Build Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image_type }}
          tags: metanorma-${{ matrix.image_type }}:test
          load: true
          push: false
          build-args: |
            METANORMA_IMAGE_NAME=metanorma-${{ matrix.image_type }}
            RUBY_VERSION=${{ env.RUBY_VERSION }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: metanorma-${{ matrix.image_type }}:test
          format: 'sarif'
          output: 'trivy-${{ matrix.image_type }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image_type }}.sarif
          category: trivy-${{ matrix.image_type }}
